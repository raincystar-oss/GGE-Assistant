[app]
data_root = data
db_path = gge.sqlite3
lock_path = gge.lock
log_path = logs/gge.log
use_test_handlers = false

[anythingllm]
base_url = http://127.0.0.1:3001/api/v1
api_key_path = .private/anythingllm_api_key.txt
workspace_slug = gge

[chunks]
target_seconds = 240
overlap_seconds = 45
max_document_chars = 1800

[tools]
ffmpeg_path = ffmpeg
ffprobe_path = ffprobe

[whisper]
model = large-v3
device = cuda
compute_type = float16
language = ru
beam_size = 5
# Optional local cache used by the stage 01 probe:
# model_cache_dir = data/probe01/models

[audio]
quality_check = true
keep_audio = false
min_audio_duration_seconds = 30
min_transcript_chars = 100
